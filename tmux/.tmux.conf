# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg terminal-overrides ",*:RGB"

# Change the prefix key to Ctrl-a
unbind-key C-b
set-option -g prefix C-Space
unbind-key C-a 

# bind-key C-a send-prefix
# Sessionizer binding (no prefix)
bind-key C-f run-shell "tmux new-window -c '#{pane_current_path}' 'tmux-sessionizer'"
bind-key C-n command-prompt "new-session -s '%%'"
bind-key n next-window
bind-key p previous-window

# Resize with Ctrl + Arrow keys (5-cell increments)
# The -r flag allows repeated tapping after a single prefix
bind-key -r -T prefix C-Up    resize-pane -U 5
bind-key -r -T prefix C-Down  resize-pane -D 5
bind-key -r -T prefix C-Left  resize-pane -L 5
bind-key -r -T prefix C-Right resize-pane -R 5

# 'PREFIX r' to reload the config file
unbind r
bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'

# start numbering at 1
# use `move-window -r` to renumber windows
set-option -g base-index 1
set-option -g pane-base-index 1
bind-key / move-window -r 
set -g renumber-windows on

# turn on the mouse
set-option -g mouse on

# bigger scrollback buffer
set-option -g history-limit 100000

# change the terminal emulator title
set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

# change the starting directory of new windows and panes
bind-key c new-window -c "#{pane_current_path}"
bind-key - split-window -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"

# turn focus events on
set-option -s focus-events off
set-option -s extended-keys off
set-option -s escape-time 0

set -g main-pane-width "70%"

##### CORE #####
set -g status on
set -g status-interval 5
set -g status-justify left

##### COLORS (Kanazawa / Ghostty-neutral) #####
set -g status-style fg=colour245,bg=default
set -g window-status-style fg=colour240,bg=default
set -g window-status-current-style fg=colour246,bg=default

##### LEFT — SESSION NAME #####
set -g status-left-length 100
set -g status-left "[#S] "

##### WINDOWS — CENTRE, NO BOXES #####
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W󱐋#{?window_zoomed_flag,󰊓,}"

##### RIGHT — TIME ONLY #####
# set -g status-right "%Y-%m-%d %H:%M"
set -g status-right "%a %b %d :: %H:%M"

##### REMOVE VISUAL NOISE #####
set -g message-style fg=colour245,bg=default
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=colour245

##### TRUE ZEN TOUCHES #####
set -g status-left-style dim
set -g status-right-style dim

# Toggle status bar visibility
bind b run-shell "tmux setw -g status \$(tmux show -g -w status | grep -q off && echo on || echo off)"


# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep at the bottom!
run '~/.tmux/plugins/tpm/tpm'
